openapi: 3.0.3
info:
  title: UCHQUN API - Yosh bilimdonlar uyi
  version: 1.0.0
  description: |-
    UCHQUN platformasi uchun REST API.
    O'quvchilar, ota-onalar nazorati, kurslar, mavzular, taqdimotlar (PDF), mini-testlar, amaliy topshiriqlar va guruh reyting tizimini to'liq qamrab oladi.
paths:
  /api/v1/analytics/leaderboard/:
    get:
      operationId: v1_analytics_leaderboard_retrieve
      description: |-
        Guruh bo'yicha umumiy reyting (Figma Reyting bo'limi).
        O'quvchilar va ota-onalar guruhdagi barcha o'quvchilarning to'plagan ballari va o'rnini ko'ra oladi.
      parameters:
      - in: query
        name: group_id
        schema:
          type: integer
        description: Guruh ID (agar berilmasa joriy guruh olinadi)
      tags:
      - Leaderboard & Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Guruh reyting jadvali
  /api/v1/analytics/my-attendance/:
    get:
      operationId: v1_analytics_my_attendance_list
      description: O'quvchining o'z davomati tarixi va ko'rsatkichlari.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
  /api/v1/assignments/{id}/:
    get:
      operationId: v1_assignments_retrieve
      description: Amaliy topshiriqning to'liq tafsilotlari.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Assignments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDetail'
          description: ''
  /api/v1/assignments/{id}/submit/:
    post:
      operationId: v1_assignments_submit_create
      description: |-
        Vazifani topshirish (Figma 5-ekran 'Vazifani topshirish' tugmasi).
        O'quvchi topshiriq natijasini rasm (skrinshot), fayl, GitHub havola yoki kod sifatida yuklaydi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Assignments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitAssignmentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssignmentRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Vazifa muvaffaqiyatli topshirildi
  /api/v1/assignments/daily-featured/:
    get:
      operationId: v1_assignments_daily_featured_retrieve
      description: |-
        Dashboarddagi bugungi asosiy vazifa banneri (Figma 3-ekran).
        'Bugungi vazifa: Portfolio loyihasini yakunlash'
        'Haftalik amaliy topshiriq topshirish vaqti tugashiga 1 kun qoldi.'
      tags:
      - Assignments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Bugungi bosh vazifa banneri
  /api/v1/assignments/my-submissions/:
    get:
      operationId: v1_assignments_my_submissions_list
      description: O'quvchining barcha topshirgan uy ishlari ro'yxati (Figma Topshiriqlar
        bo'limi).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssignmentSubmissionList'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Tizimga kirish (Figma 1-ekran).
        Foydalanuvchi administratsiya bergan email va parol bilan tizimga kiradi.
        Muvaffaqiyatli kirganda JWT access va refresh tokenlar hamda foydalanuvchi ma'lumotlari qaytariladi.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Muvaffaqiyatli kirish
        '400':
          description: Noto'g'ri login/parol
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/communication/announcements/:
    get:
      operationId: v1_communication_announcements_list
      description: E'lonlar va muloqot markazi xabarlari (Figma Muloqot markazi).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
  /api/v1/communication/notifications/:
    get:
      operationId: v1_communication_notifications_list
      description: Foydalanuvchining shaxsiy bildirishnomalari (Figma tepa o'ngdagi
        qo'ng'iroqcha belgisi).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/communication/notifications/{id}/read/:
    post:
      operationId: v1_communication_notifications_read_create
      description: Bildirishnomani o'qilgan deb belgilash.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communication
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: O'qilgan deb belgilandi
  /api/v1/communication/notifications/read-all/:
    post:
      operationId: v1_communication_notifications_read_all_create
      description: Barcha bildirishnomalarni o'qilgan deb belgilash.
      tags:
      - Communication
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Barchasi o'qildi
  /api/v1/courses/:
    get:
      operationId: v1_courses_list
      description: |-
        Ruxsat etilgan dasturlar va kurslar ro'yxati (Figma 2-ekran).
        Foydalanuvchiga qaysi kurslar OCHIQ va qaysilari YOPIQ (Navbat kutilmoqda) ekanligini qaytaradi.
        Tizim cheklovi: Maksimum 1-2 ta kurs ochiq bo'lishi mumkin.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseListList'
          description: ''
  /api/v1/courses/{slug}/modules/:
    get:
      operationId: v1_courses_modules_list
      description: |-
        Tanlangan kursning modullari ro'yxati (Figma 3-ekran).
        Masalan: HTML Asoslari, CSS Visual Dizayn, JavaScript Dasturlash.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: 'Kursning slugi (masalan: frontend-dasturlash)'
        required: true
      tags:
      - Modules & Topics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
          description: ''
  /api/v1/groups/:
    get:
      operationId: v1_groups_list
      description: O'quv guruhlari ro'yxati.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupList'
          description: ''
  /api/v1/modules/{module_id}/topics/:
    get:
      operationId: v1_modules_topics_list
      description: |-
        Tanlangan modulning mavzular ro'yxati (Figma 4-ekran).
        Mavzular bo'yicha qidiruv (search) imkoniyati mavjud.
      parameters:
      - in: path
        name: module_id
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTopicListList'
          description: ''
  /api/v1/parent/child-dashboard/{student_id}/:
    get:
      operationId: v1_parent_child_dashboard_retrieve
      description: |-
        Ota-onalar uchun farzandini to'liq nazorat qilish paneli (monitoring).
        - Guruhdagi o'rni (reyting)
        - Davomat va kelmagan kunlari
        - Qolib ketgan darslar va prezentatsiyalar (.pdf)
        - Uy vazifalari (baho, taqriz, topshirilmaganlar)
        - Test natijalari
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - Parent Monitoring
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Farzand monitoring ma'lumotlari
  /api/v1/parent/my-children/:
    get:
      operationId: v1_parent_my_children_retrieve
      description: Ota-onaga biriktirilgan farzandlar ro'yxati.
      tags:
      - Parent Monitoring
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Farzandlar ro'yxati
  /api/v1/profile/change-password/:
    post:
      operationId: v1_profile_change_password_create
      description: Parolni o'zgartirish.
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/profile/me/:
    get:
      operationId: v1_profile_me_retrieve
      description: Foydalanuvchi profil ma'lumotlarini olish va tahrirlash (Figma
        Mening profilim).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_profile_me_update
      description: Foydalanuvchi profil ma'lumotlarini olish va tahrirlash (Figma
        Mening profilim).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_profile_me_partial_update
      description: Foydalanuvchi profil ma'lumotlarini olish va tahrirlash (Figma
        Mening profilim).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/quizzes/{id}/:
    get:
      operationId: v1_quizzes_retrieve
      description: Bitta test ma'lumotlari va savollari.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Quizzes
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDetail'
          description: ''
  /api/v1/quizzes/{id}/submit/:
    post:
      operationId: v1_quizzes_submit_create
      description: |-
        Mini-test javoblarini topshirish va darhol natijani hisoblash.
        To'g'ri/noto'g'ri javoblarni ko'rsatadi, ball beradi va o'quvchi profiliga qo'shadi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Quizzes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Test natijasi muvaffaqiyatli hisoblandi
  /api/v1/submissions/{id}/grade/:
    post:
      operationId: v1_submissions_grade_create
      description: O'qituvchi yoki admin tomonidan o'quvchining vazifasini baholash
        va izoh qoldirish.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Vazifa baholandi
  /api/v1/topics/{id}/:
    get:
      operationId: v1_topics_retrieve
      description: |-
        Mavzu tafsilotlari (Figma 5-ekran).
        Dars Prezentatsiyasi (PDF yuklab olish, slaydlar), dars kodi, mini-testlar va amaliy topshiriq ma'lumotlari.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Modules & Topics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
          description: ''
  /api/v1/topics/{id}/progress/:
    post:
      operationId: v1_topics_progress_create
      description: |-
        O'quvchining mavzuni o'zlashtirish progressini yangilash.
        Slayd ko'rilganda yoki PDF yuklab olinganda chaqiriladi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Modules & Topics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicProgressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateTopicProgressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateTopicProgressRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Progress yangilandi
  /api/v1/topics/{topic_id}/assignment/:
    get:
      operationId: v1_topics_assignment_retrieve
      description: |-
        Mavzuga biriktirilgan amaliy topshiriq (Figma 5-ekran o'ng tomon).
        [100 BALL] [Muddat: 1 kun qoldi]
      parameters:
      - in: path
        name: topic_id
        schema:
          type: integer
        required: true
      tags:
      - Assignments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentDetail'
          description: ''
  /api/v1/topics/{topic_id}/quizzes/:
    get:
      operationId: v1_topics_quizzes_list
      description: |-
        Mavzuga tegishli mini-testlar ro'yxati (Figma 5-ekran).
        O'quvchining oldingi topshirgan javoblari (TO'G'RI / Qayta yechish) bilan birga qaytaradi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: topic_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuizDetailList'
          description: ''
components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: E'lon sarlavhasi
          maxLength: 255
        content:
          type: string
          title: E'lon matni
        group:
          type: integer
          nullable: true
          title: Qaysi guruhga (bo'sh bo'lsa hammaga)
        group_name:
          type: string
          title: 'Guruh nomi (masalan: F-2401)'
          readOnly: true
        author_name:
          type: string
          readOnly: true
        is_pinned:
          type: boolean
          title: Yuqoriga qadab qo'yish
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Chop etilgan vaqti
      required:
      - author_name
      - content
      - created_at
      - group_name
      - id
      - title
    AnswerOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Tartibi
        text:
          type: string
          title: 'Variant matni (masalan: A) UTF-8)'
          maxLength: 300
      required:
      - id
      - text
    AssignmentDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        topic:
          type: integer
          title: Mavzu
        topic_title:
          type: string
          title: 'Mavzu nomi (masalan: Metateglar va Semantika)'
          readOnly: true
        module_title:
          type: string
          title: 'Modul nomi (masalan: HTML Asoslari)'
          readOnly: true
        course_title:
          type: string
          title: Kurs nomi
          readOnly: true
        title:
          type: string
          title: 'Topshiriq nomi (masalan: Loyiha uchun asosiy metadasturlarni sozlash)'
          maxLength: 255
        description:
          type: string
          title: Topshiriq sharti va talablari
        max_score:
          type: integer
